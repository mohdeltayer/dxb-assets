  # Official X accounts through X's public embedded-timeline page (no login, no API key).
  # Unofficial endpoint: X can change or block it, it answers 429 when asked too often, and it
  # lags the live timeline by minutes (retweets are skipped). It rate-limits hard: in the 27 Oct
  # test five accounts read fine, then every request answered 429 for the next 15+ minutes, so
  # the list is short, one request at a time with a gap, and a 429 backs the source off. Add
  # accounts here only after watching the `failed` line for a day. Set `x_embed: false` below
  # to switch the kind off. Gaming Watch (the scout digest) stays the fallback for X.
  - {id: x-playstation,   name: "PlayStation (X)",       kind: x, handle: PlayStation,     interval_min: 15, breaking: true}
  - {id: x-xbox,          name: "Xbox (X)",              kind: x, handle: XBOX,            interval_min: 15, breaking: true}
  - {id: x-nintendo-us,   name: "Nintendo of America (X)", kind: x, handle: NintendoAmerica, interval_min: 15, breaking: true}
  - {id: x-rockstar,      name: "Rockstar Games (X)",    kind: x, handle: RockstarGames,   interval_min: 15, breaking: true}
  - {id: x-playstation-me, name: "PlayStation Middle East (X)", kind: x, handle: PlayStation_ME, interval_min: 15}

  # Steam news from the scout source audit (notes/scout-source-audit-2026-09-28.md). The hub feed mixes
  # developer posts with press articles, so it is read as an outlet (a lead, grouped with the others);
  # the per-app feed is Valve's own.
  - {id: steam-news,      name: "Steam News (hub)",      kind: outlet,   url: "https://store.steampowered.com/feeds/news/?l=english",   interval_min: 10}
  - {id: steam-deck-news, name: "Steam Deck (Steam news)", kind: official, url: "https://store.steampowered.com/feeds/news/app/1675200/", interval_min: 15}

  # Outlets that are leads only (scout audit, section 6): Japanese, Gulf and Nintendo sites.
  - {id: out-denfami,     name: "Denfaminicogamer (JP)", kind: outlet, url: "https://news.denfaminicogamer.jp/feed",        interval_min: 10}
  - {id: out-gamespark,   name: "Game*Spark (JP)",       kind: outlet, url: "https://www.gamespark.jp/rss/index.rdf",       interval_min: 10}
  - {id: out-tweaktown,   name: "TweakTown",             kind: outlet, url: "https://www.tweaktown.com/feeds/news-mf.xml",  interval_min: 10}
  - {id: out-tbreak,      name: "Tbreak (Gulf)",         kind: outlet, url: "https://www.tbreak.com/feed/",                 interval_min: 10}
  - {id: out-nintendo-everything, name: "Nintendo Everything", kind: outlet, url: "https://nintendoeverything.com/feed/",   interval_min: 10}
  - {id: out-gonintendo,  name: "GoNintendo",            kind: outlet, url: "https://gonintendo.com/feeds/all.xml",         interval_min: 10}
  - {id: out-gol,         name: "GamingOnLinux",         kind: outlet, url: "https://www.gamingonlinux.com/article_rss.php", interval_min: 15}

# Master switches (a switched-off kind is not read at all)
kinds:
  youtube: true
  x_embed: true

# How the digests reach the news desk. Environment variables of the same names in capitals
# (WATCH_REMOTE, WATCH_BRANCH, WATCH_EMPTY_PUSH_H, WATCH_PUSH=off) override these.
handoff:
  # Recommended: a small private repo made for this, with no workflows, so a push costs no
  # Actions minutes and the write token cannot reach the publisher. See README, "How the main
  # session reads the digest" for why dxb-queue is the fallback, not the default.
  remote: https://github.com/mohdeltayer/dxb-watch.git
  branch: main
  token_file: /etc/dxb-watch/github-token
  # An hourly digest with nothing new is still pushed (it is the watch's heartbeat) unless the
  # last push is younger than this many hours. Use 3 on dxb-queue, where every push runs gitleaks.
  empty_push_min_gap_h: 1
  # The history is squashed to one commit every this many days, so the repo stays a few hundred KB.
  squash_days: 7
  commit_name: dxb-watch
  commit_email: noreply@github.com

# Official sources that cannot be read mechanically. Printed in every digest under
# "not covered" so the news desk (or the Gaming Watch digest) picks them up.
not_covered:
  - {name: "Official X accounts not listed above", reason: "no public page without login; read by Gaming Watch (scout digest) and the Verifier"}
  - {name: "Konami JP topics", reason: "the list is drawn by script (the page carries one topic); Konami is covered by the outlets only"}
  - {name: "Konami, EA and Activision YouTube channels", reason: "their channel feeds are empty; EA is read through its news page, Activision and Konami through the outlets"}
  - {name: "PS Store UAE/Saudi, Xbox and Steam regional prices", reason: "price watching is its own job (scout audit section 6), not part of this service"}
  - {name: "Epic Games, Sony Group press, GitHub releases", reason: "answer 403 to a script"}
  - {name: "Saudi Esports Federation, GEA, UAE gaming bodies", reason: "refuse automated reads or carry no feed"}
