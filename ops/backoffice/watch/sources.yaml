# Sources and cadence for the mechanical watch (service 1 of the back office).
#
# The lists in newsroom/watch_feeds.py (OFFICIAL, OUTLETS) and newsroom/watch_pages.py (PAGES)
# are imported as they stand, so the news desk keeps one place to add a feed. This file only
# sets how often each group is read and which sources are "breaking". Anything the watch reads
# that those files do not hold is listed under `extra`.
#
# `interval_min`: a source is read when its last read is older than this. The poll timer wakes
# every 5 minutes, so 5 is the floor. Failing sources back off (x2 per failure, up to x8).
# `breaking: true`: a new item from this source is handed to the news desk within minutes of
# the poll that finds it, not at the next hourly digest. It marks where the first-party news
# appears, not that the item is breaking news: the Verifier still grades it.

version: 1

defaults:
  interval_min: 15
  breaking: false

# What counts as new on the first read of a source. Everything older is recorded as already
# seen (baseline) and never handed over, so a new source cannot flood the desk.
first_poll_window_h: 2

# Items first published more than this many days ago are recorded, not reported (as watch_feeds.py).
report_max_age_days: 2

imported:
  watch_feeds:
    official:     {interval_min: 5}    # first-party RSS/Atom feeds
    parsed_pages: {interval_min: 15}   # first-party pages and APIs read by a parser (Bandai Namco, HoYoLAB, PUBG Mobile...)
    gnews:        {interval_min: 30}   # Google News backstops, hours late by nature
    outlets:      {interval_min: 10}   # the 31 outlet feeds; leads, never breaking
  watch_pages:    {interval_min: 15}   # the no-feed official pages (Nintendo US, Capcom IR, EA, Riot, TGA, Famitsu...)
  # Imported sources that are known not to work (listed under not_covered as well)
  disabled: ["Konami JP"]
  overrides:
    "PlayStation Blog": {breaking: true, interval_min: 3}
    "Xbox Wire":        {breaking: true, interval_min: 3}
    "Nintendo Japan":   {breaking: true}
    "Nintendo US":      {breaking: true}
    "Take-Two":         {breaking: true}
    "Bungie":           {breaking: true}
    "The Game Awards":  {breaking: true}

