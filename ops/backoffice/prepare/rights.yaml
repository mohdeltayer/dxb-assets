    hosts: [sega.com, sega.co.jp, sega.jp, segaamerica.com, sega-europe.com, atlus.com, atlus.co.jp]
    press_hosts: [press.sega.com, sega.press]
    steam_names: [SEGA, Sega, ATLUS]
  bandai-namco:
