# Rights terms the prepare service relies on, per publisher (machine-readable side of ops/rights-register.md).
# Names, hosts and terms only; never a token, a login or a private link.
#
# basis:          the terms relied on (press grant | per-kit editorial terms | fan guidelines | unreviewed)
# excerpt_only:   true when the terms are fan guidelines, not a press licence: short excerpts, credit on screen
# on_screen_credit: the Reel names the publisher on screen while its footage plays
# music_flag:     trailer music is restricted or flagged separately by this publisher: check before using the sound
# hosts:          domain suffixes the publisher serves its pages and files from (step 1, publisher-issued file)
# press_hosts:    domain suffixes of its public press-asset sites (step 2); confirm on first use
# steam_names:    publisher names as Steam's store data writes them (step 3)
#
# A file from a host no entry claims is never taken at step 1 or 2. A Steam trailer whose publisher has no entry is
# prepared with basis "unreviewed" and rights_review: true, so the brief sees it before any use.

cdn_suffixes:          # generic CDNs: accepted at step 1 only when the page that links the file is the publisher's own
  - akamaized.net
  - akamaihd.net
  - cloudfront.net
  - azureedge.net
  - fastly.net

publishers:
  square-enix:
    name: Square Enix
    basis: press grant
    terms: Square Enix press site grant for editorial use of its press assets (trailers, screenshots, key art) in news coverage.
    excerpt_only: false
    on_screen_credit: true
    music_flag: null
    hosts: [square-enix.com, square-enix-games.com, square-enix.co.jp, jp.square-enix.com, na.square-enix.com, eu.square-enix.com]
    press_hosts: [press.square-enix.com, press.square-enix-games.com, sqex-press.com]
    steam_names: [Square Enix, SQUARE ENIX]
  ubisoft:
    name: Ubisoft
    basis: per-kit editorial terms
    terms: Each Ubisoft press kit states its own editorial terms; the kit's terms page is the basis for that asset.
    excerpt_only: false
    on_screen_credit: true
    music_flag: Ubisoft flags trailer music separately; read the kit's music note before using the trailer sound.
    hosts: [ubisoft.com, ubi.com, staticctf.ubisoft.com, news.ubisoft.com]
    press_hosts: [press.ubisoft.com, ubisoftpress.com]
    steam_names: [Ubisoft]
  sega:
    name: SEGA
