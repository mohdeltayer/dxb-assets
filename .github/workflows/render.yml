# Render runner (advisor, 20 Oct 2026, agreed with Mohammad): one Reel per job file in
# jobs/render/, rendered on a GitHub runner and committed back to cards/YYYY-MM/.
# The Dubai font comes from the private dxb-fonts repo through FONTS_TOKEN into a temp
# folder outside the workspace: never committed, never uploaded, never printed, and
# deleted at the end (its licence forbids redistribution). No pull_request trigger, so
# outside forks never see the secret. The repo default stays read-only; only this
# workflow may write.
name: render

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['jobs/render/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'One job file (jobs/render/<name>.json); empty renders every file there'
        required: false
        default: ''
      retry:
        description: 'Set to 1 by the automatic retry of a lost runner (never retried again); leave empty by hand'
        required: false
        default: ''

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: jobs
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.job }}
        run: |
          if [ -n "$INPUT" ]; then
            files="$INPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --depth=1 --filter=blob:none origin "$BEFORE"
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'jobs/render/*.json')
          else
            files=$(ls jobs/render/*.json 2>/dev/null || true)
          fi
          echo "jobs=$(printf '%s\n' $files | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')" >> "$GITHUB_OUTPUT"

  render:
    needs: list
    if: needs.list.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per job file at a time (26 Oct 2026): a second dispatch for the same file waits for the running render
    # instead of cancelling it or racing it to the commit; different files still render in parallel. GitHub keeps one
    # waiting run per group, so a third dispatch for the same file replaces the second.
    concurrency:
      group: render-${{ matrix.job }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.list.outputs.jobs) }}
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            templates
            jobs

      - name: Runner
        run: |
          echo "cores $(nproc), $(free -g | awk '/Mem:/{print $2}') GB, $(lsb_release -ds)"
          {
            echo "T_START=$(date +%s)"
            echo "RENDER_LANE=runner"
            echo "RENDER_QUEUED_AT=${{ github.event.head_commit.timestamp || '' }}"
            echo "RENDER_RETRY=${{ github.event.inputs.retry || '' }}"
            echo "DUBAI_FONTS=$RUNNER_TEMP/dubai-fonts"
            echo "DXB_UPLOADS=$RUNNER_TEMP/uploads"
            echo "YOLO_WEIGHTS=$RUNNER_TEMP/models/yolov8n.pt"
          } >> "$GITHUB_ENV"

      - name: Fonts (temp folder, outside the workspace)
        env:
          FONTS_TOKEN: ${{ secrets.FONTS_TOKEN }}
        run: |
          repo="$RUNNER_TEMP/dxb-fonts"
          git clone -q --depth 1 "https://x-access-token:${FONTS_TOKEN}@github.com/mohdeltayer/dxb-fonts.git" "$repo"
          mkdir -p "$DUBAI_FONTS"
          unzip -q -C -j -o "$repo/dubai.zip" '*.ttf' -d "$DUBAI_FONTS"
          rm -rf "$repo"
          for w in Light Regular Medium Bold; do test -f "$DUBAI_FONTS/Dubai-$w.ttf" || { echo "Dubai-$w.ttf missing from dubai.zip"; exit 1; }; done

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Text check (fails in seconds on a bad wrap)
        run: |
          python -m pip install -q pillow numpy soundfile pedalboard
          python templates/render_job.py text "$JOB"

      - name: Tools
        timeout-minutes: 10                        # a hung apt or pip mirror held two runs for 15 minutes on 23 Oct
        run: |
          echo "$(date -u +%T) apt"
          # four runs on 23 Oct sat silent at apt install for 10 minutes: a fresh VM's unattended-upgrades holds the dpkg lock
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          sudo rm -f /var/lib/man-db/auto-update
          need=""; command -v ffmpeg >/dev/null || need="ffmpeg"; command -v tesseract >/dev/null || need="$need tesseract-ocr tesseract-ocr-eng"
          if [ -n "$need" ]; then $APT update -qq 2>&1 | tail -3; echo "$(date -u +%T) apt install $need"; timeout 150 $APT install -y -q --no-install-recommends $need 2>&1 | tail -5 || true; fi
          if ! command -v ffmpeg >/dev/null; then                # the Azure apt mirror stalled mid-download on 23 Oct: a static build from GitHub instead
            echo "$(date -u +%T) static ffmpeg"
            curl -sSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/ff.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf "$RUNNER_TEMP/ff.tar.xz" -C "$RUNNER_TEMP" && sudo cp "$RUNNER_TEMP"/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          command -v ffmpeg; command -v tesseract || echo "tesseract missing: sheet text checks will warn"
          echo "$(date -u +%T) pip"
          python -m pip install -q --upgrade pip
          python -m pip install -q --timeout 60 --retries 3 torch torchvision --index-url https://download.pytorch.org/whl/cpu   # a matching pair, or YOLO's nms op is missing
          echo "$(date -u +%T) pip rest"
          python -m pip install -q --timeout 60 --retries 3 pillow numpy soundfile pedalboard ultralytics opencv-python-headless
          echo "$(date -u +%T) tools done"
          mkdir -p "$DXB_UPLOADS" "$(dirname "$YOLO_WEIGHTS")"

      # HyperFrames inserts (advisor, 24 Oct 2026) and the design pass (frame and kit moments, 24 Oct 2026,
      # templates/designpass.py): installed only when the job asks for one, pinned to the tested version. A failed
      # install leaves HF_CLI unset, so the insert keeps its current card and the design pass renders as before.
      - name: HyperFrames (only for a job with an insert, a frame or kit moments)
        id: hf
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('$JOB')).get('insert') else 1)" \
             || python templates/designpass.py need "$JOB"; then
            echo "need=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.hf.outputs.need == '1'
        with:
          node-version: '22'

      - name: HyperFrames install
        if: steps.hf.outputs.need == '1'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/hf" && cd "$RUNNER_TEMP/hf"
          npm i -s --no-audit --no-fund hyperframes@0.8.143
          npx hyperframes browser ensure
          echo "HF_CLI=$RUNNER_TEMP/hf/node_modules/.bin/hyperframes" >> "$GITHUB_ENV"

      # Trailer audio split (Mohammad, 24 Oct 2026, inbox 16:26Z: "Adopt Cocktail Fork"): only for a job on a trailer
      # track (templates/tracksplit.py). MERL Cocktail Fork, MIT code and weights, pinned; the weights live in the Actions
      # cache, never in git. A failed install leaves COCKTAIL_DIR unset, so the Reel keeps today's audio.
      - name: Audio split (only for a trailer-track job)
        id: split
        run: |
          if python templates/tracksplit.py need "$JOB"; then
            echo "need=1" >> "$GITHUB_OUTPUT"
            # stem cache for this job file (tracksplit.py): SPLIT_CACHE_NEW is touched when a stretch was separated afresh
            { echo "SPLIT_CACHE=$HOME/.cache/tracksplit-stems"; echo "SPLIT_CACHE_NEW=$RUNNER_TEMP/split-cache-new"; } >> "$GITHUB_ENV"
          fi

      - uses: actions/cache@v4
        if: steps.split.outputs.need == '1'
        with:
          path: ~/.cache/cocktail-fork
          key: cocktail-fork-19b3de827ebc4bfb014570cf92dd32b4ee3b6921

      # Separated stems per trailer stretch (26 Oct 2026): one cache entry per job file, newest restored by prefix, saved
      # after the render only when a stretch was separated afresh. A miss separates exactly as before.
      - uses: actions/cache/restore@v4
        if: steps.split.outputs.need == '1'
        with:
          path: ~/.cache/tracksplit-stems
          key: tracksplit-19b3de827ebc4bfb014570cf92dd32b4ee3b6921-${{ matrix.job }}-${{ github.run_id }}
          restore-keys: |
            tracksplit-19b3de827ebc4bfb014570cf92dd32b4ee3b6921-${{ matrix.job }}-

      - name: Cocktail Fork install
        if: steps.split.outputs.need == '1'
        continue-on-error: true
        timeout-minutes: 4
        env:
          SHA: 19b3de827ebc4bfb014570cf92dd32b4ee3b6921
        run: |
          d="$HOME/.cache/cocktail-fork/$SHA"; mkdir -p "$d/checkpoints"
          [ -s "$d/mrx.py" ] || curl -sSfL --retry 3 -o "$d/mrx.py" "https://raw.githubusercontent.com/merlresearch/cocktail-fork-separation/$SHA/mrx.py"
          w="$d/checkpoints/default_mrx_pre_trained_weights.pth"
          [ -s "$w" ] || curl -sSfL --retry 3 -o "$w" "https://media.githubusercontent.com/media/merlresearch/cocktail-fork-separation/$SHA/checkpoints/default_mrx_pre_trained_weights.pth"
          python -m pip install -q --timeout 60 --retries 3 pyloudnorm==0.1.1
          python -c "import sys, torch; sys.path.insert(0, '$d'); import mrx; m = mrx.MRX(); m.load_state_dict(torch.load('$w', map_location='cpu', weights_only=True)); print('cocktail fork ready')"
          echo "COCKTAIL_DIR=$d" >> "$GITHUB_ENV"

      # Render fails the job, before anything is committed, when a fetched source reports decode errors twice,
      # a shot's source stretch or the finished Reel shows a blocky smear (templates/decodecheck.py; advisor,
      # 21 Oct 2026, after the Battlefield 1 Reel carried a damaged download)
      - name: Render
        timeout-minutes: 15                        # a real hang fails here, clearly, and is not retried (Tools has 10, the job 60)
        run: |
          start=$(date +%s)
          echo "SETUP_SECS=$(( start - T_START ))" >> "$GITHUB_ENV"
          # peak memory and disk during the render (templates/runner_stats.py): logged even when the render fails,
          # and added to the render-times entry below; sampling never fails the step
          stats="$RUNNER_TEMP/runner-stats.json"
          python templates/runner_stats.py start "$stats" || true
          trap 'python templates/runner_stats.py stop "$stats" || true' EXIT
          python templates/render_job.py run "$JOB"
          echo "RENDER_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          # keep this run's render-times entry; the commit step rebuilds on the latest main
          python -c "import json; e = json.load(open('templates/assets/render-times.json'))[-1]; e['runner'] = 'actions'; e['cores'] = $(nproc); e['job_secs'] = None; json.dump(e, open('$RUNNER_TEMP/render-time.json', 'w'))"
          python templates/runner_stats.py stop "$stats" || true
          python templates/runner_stats.py merge "$stats" "$RUNNER_TEMP/render-time.json" || true

      # Save the new stems even when a later check failed the render, so the fixed job's re-render skips the separation.
      - name: Audio split cache, anything new?
        id: splitnew
        if: ${{ !cancelled() && steps.split.outputs.need == '1' }}
        run: if [ -e "$SPLIT_CACHE_NEW" ]; then echo "new=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.splitnew.outputs.new == '1' }}
        with:
          path: ~/.cache/tracksplit-stems
          key: tracksplit-19b3de827ebc4bfb014570cf92dd32b4ee3b6921-${{ matrix.job }}-${{ github.run_id }}

      - name: Commit back
        run: |
          out=$(python -c "import json; print(json.load(open('$JOB'))['out'])")
          echo "OUT=$out" >> "$GITHUB_ENV"
          # B8 test runs (build branch, jobs/test/): outputs under cards/test/ only, no render-times entry
          TEST=0; case "$JOB" in jobs/test/*) TEST=1;; esac
          if [ $TEST = 1 ]; then case "$out" in cards/test/*) ;; *) echo "a test job writes under cards/test/ only"; exit 1;; esac; fi
          stem="${out%.mp4}"; base="${stem%-reel-v*}"
          files="$out $base-strip.jpg $base-sheet.jpg"
          # 4 frames a second through the Reel (decodecheck.dense_strip), so the first second of every shot is seen
          if [ -f "$base-dense.jpg" ]; then files="$files $base-dense.jpg"; fi
          # QC record bound to the file (templates/qcrecord.py), only for a job with "qc": the gate for scheduling reads it
          if [ -f "$base-qc.json" ]; then files="$files $base-qc.json"; fi
          mkdir -p "$RUNNER_TEMP/out"
          for f in $files; do cp --parents "$f" "$RUNNER_TEMP/out/"; done
          git config user.name "dxb-render"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 --filter=blob:none origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp -r "$RUNNER_TEMP/out/." .
            [ $TEST = 1 ] || python -c "import json; p = 'templates/assets/render-times.json'; d = json.load(open(p)); e = json.load(open('$RUNNER_TEMP/render-time.json')); e['job_secs'] = $RENDER_SECS; e['setup_min'] = round($SETUP_SECS / 60, 2); e['story'] = '$(basename "$JOB" .json)'; d.append(e); json.dump(d, open(p, 'w'), indent=1, ensure_ascii=False)"
            if [ $TEST = 1 ]; then git add --sparse -f $files; else git add --sparse -f $files templates/assets/render-times.json; fi
            if [ -f "$JOB" ]; then git rm -q "$JOB"; fi
            git commit -q -m "Render $(basename "$JOB" .json) on the runner ($RENDER_SECS s, $(nproc) cores)"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $(( i * 5 ))
          done
          echo "push failed five times"; exit 1

      # Phase 1 step 3 (advisor, 25 Oct 2026): the finished Reel goes straight to Publer's media library with
      # the media-only key, so scheduling never needs a public link. Never fails the job: no key, a failed
      # upload or a timeout leaves a receipt saying so, and production falls back to the connector upload.
      # The media id goes into the receipt only while the repo is private; otherwise production finds the
      # file in Publer by its name. Nothing from Publer is printed.
      - name: Publer upload
        if: ${{ !startsWith(env.JOB, 'jobs/test/') }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          PUBLER_MEDIA_KEY: ${{ secrets.PUBLER_MEDIA_KEY }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          base="${OUT%.mp4}"; receipt="$base-publer.json"
          python templates/publer_upload.py "$RUNNER_TEMP/out/$OUT" "$RUNNER_TEMP/publer.json" || true
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 --filter=blob:none origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$receipt")"; cp "$RUNNER_TEMP/publer.json" "$receipt"
            git add --sparse -f "$receipt"
            git commit -q -m "Publer receipt $(basename "$base")"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $(( i * 5 ))
          done

      - name: Remove fonts
        if: always()
        run: rm -rf "$DUBAI_FONTS" "$RUNNER_TEMP/dxb-fonts"

      # Last step. It runs only when one of our own steps failed (or a human cancelled), so a job that failed
      # without it having run is a lost runner: the retry job below reads exactly that from the Actions API.
      - name: Failure marker
        if: ${{ failure() || cancelled() }}
        run: echo "render failed through its own steps at $(date -u +%T); no automatic retry"

  # One automatic retry (26 Oct 2026, "Add all five"). A lost runner cannot be retried from inside its job, so this
  # follow-up job re-dispatches this workflow once for a job file whose render died without any error from our own
  # steps and committed nothing (templates/render_retry.py has the rules). It is the only job that gets
  # `actions: write` (workflow_dispatch needs it); the render job keeps `contents: write` alone, and this job has
  # contents read only, no secrets and no checkout of anything but the templates.
  retry:
    needs: render
    if: ${{ failure() && needs.render.result == 'failure' && github.event.inputs.retry != '1' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: templates
      - name: Retry a lost runner once
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_INPUT: ${{ github.event.inputs.retry }}
        run: python3 templates/render_retry.py
