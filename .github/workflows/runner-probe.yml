# Probe for the dxb-render server (advisor memo, 26 Oct 2026). A one-second job on the self-hosted runner: the
# route step of a render workflow dispatches it, and whether it starts within five minutes tells that workflow
# whether the server is up and free (scripts/runner-route.sh; if not, it cancels this run so nothing lingers
# in the queue). It runs no repository code, checks nothing out, has no secrets and no token permissions.
# Dispatch from main only (dispatch is a write-access action; the guard also refuses any other ref and
# every fork). Never pull_request.
name: runner-probe
run-name: probe ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Probe id (set by scripts/runner-route.sh)'
        required: true

permissions: {}

jobs:
  probe:
    if: github.repository == 'mohdeltayer/dxb-assets' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dxb-render]
    timeout-minutes: 2
    steps:
      - name: Up
        run: |
          echo "dxb-render is up, $(nproc) cores, load $(cut -d' ' -f1 /proc/loadavg)"
