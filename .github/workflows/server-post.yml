# The server's publish step (Mohammad, 23 Nov 2026): the Director's verdict is a plain file (jobs/director/<name>.json)
# and this step schedules. Three Production 2 runs on 23 Nov, and runs on 17 and 18 Nov, stopped because the safety filter
# refused the Director helper's `presubmit.py director` command, and the finished inKONBINI Reel was never scheduled.
# On every keeper tick (keeper-server, every 10 minutes) and by hand: templates/serverpost.py sweep. Pass: scheduled in the
# next free slot. Fix: one more render with the fix, then scheduled. No file 20 minutes after the render: scheduled anyway,
# noted "no director verdict" (the work order and the board show it). With the PUBLER_POST_KEY secret (scopes workspaces,
# accounts, media, posts, job_status) the server schedules through Publer's API; without it the Reel is written "ready"
# and Production 2 submits it through the Publer connector (no presubmit). Nothing from Publer is printed.
name: server-post

permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
    types: [keeper-server]
  workflow_dispatch:
    inputs:
      dry:
        description: 'true: print what would happen, change nothing'
        required: false
        default: 'false'

concurrency:
  group: server-post
  cancel-in-progress: false

jobs:
  sweep:
    if: github.repository == 'mohdeltayer/dxb-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            templates
            jobs
            newsroom
            ops
      - name: Sweep
        id: sweep
        env:
          PUBLER_POST_KEY: ${{ secrets.PUBLER_POST_KEY }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then python3 templates/serverpost.py sweep --dry | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 templates/serverpost.py sweep | tee "$RUNNER_TEMP/sweep.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$PUBLER_POST_KEY" ] || echo "(no PUBLER_POST_KEY: Reels are written ready for the connector)" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: inputs.dry != 'true'
        run: |
          git config user.name "dxb-server-post"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch newsroom/serverpost.jsonl
          touch newsroom/quickpost.jsonl
          git add --sparse -A newsroom/serverpost.jsonl newsroom/submissions.jsonl newsroom/quickpost.jsonl jobs/live
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "server-post: $(grep -c . "$RUNNER_TEMP/sweep.txt" 2>/dev/null || echo 0) action(s) (director file, 23 Nov 2026)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 4)); done
      - name: Fix renders
        if: inputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep '^serverpost: fix_render ' "$RUNNER_TEMP/sweep.txt" 2>/dev/null | awk '{print $3}' | while read -r base; do
            gh workflow run render-live.yml --repo "$GITHUB_REPOSITORY" --ref main -f job="$base" && echo "fix render dispatched: $base"
          done
      # Split by platform (24 Nov 2026): a verified story with no quick card yet (a story Production 2 wrote by hand; the
      # slip lane starts its own) gets one, at most 4 per tick, once ops/cadence.json says quick_live.
      - name: Quick posts for stories without one
        if: inputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sid in $(python3 templates/quickpost.py pending | tr ' ' '\n' | head -4); do
            gh workflow run quick-post.yml --repo "$GITHUB_REPOSITORY" --ref main -f story="$sid" -f mode=live && echo "quick post dispatched: $sid"
          done
