# Event capture shadow test on the dxb-render server (adv-20261028-event-capture, Mohammad, 28 Oct 2026).
#
# Dispatch only, main only. Reads a live show stream directly (streamlink for Twitch, yt-dlp for the YouTube
# fallback; no browser, no login, no cookies) and saves one frame per second plus scene-cut frames to a folder on
# the server (DXB_CACHE/event-capture/<date>-<name>) for the build desk. Posts nothing, commits nothing, uploads no
# artifact (the frames are the broadcaster's footage and stay on the server), OCRs nothing, uses no secret.
# Low priority: nice 19 and idle I/O. Never ahead of a news render: tonight's news renders run on GitHub.
#
# Dispatch: gh workflow run event-capture.yml --ref main -f name=indie-world -f start=13:58 -f end=14:50
name: event-capture

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      name: {description: 'Show name for the folder', required: true, default: 'indie-world'}
      twitch: {description: 'Twitch channel URL (first choice)', required: true, default: 'https://www.twitch.tv/nintendo'}
      youtube: {description: 'YouTube URL (fallback)', required: true, default: 'https://www.youtube.com/watch?v=9OPoiRcze0w'}
      start: {description: 'Start, HH:MM UTC', required: true, default: '13:58'}
      end: {description: 'Hard stop, HH:MM UTC', required: true, default: '14:50'}
      switch: {description: 'Switch to YouTube if Twitch gave no frames by HH:MM UTC', required: true, default: '14:03'}

jobs:
  capture:
    if: github.repository == 'mohdeltayer/dxb-assets' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dxb-render]
    timeout-minutes: 75
    concurrency:
      group: event-capture
      cancel-in-progress: false
    env:
      TWITCH_URL: ${{ inputs.twitch }}
      YT_URL: ${{ inputs.youtube }}
      START_UTC: ${{ inputs.start }}
      END_UTC: ${{ inputs.end }}
      SWITCH_UTC: ${{ inputs.switch }}
      SHOW: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ops/backoffice/event-capture
          persist-credentials: false

      - name: Tools (streamlink, yt-dlp in the runner venv)
        run: |
          venv="${DXB_VENV:-/home/runner/venv}"; echo "VENV=$venv" >> "$GITHUB_ENV"
          case "$SHOW" in *[!a-z0-9-]*|'') echo "bad name"; exit 1;; esac
          "$venv/bin/python" -c "import streamlink" 2>/dev/null || "$venv/bin/python" -m pip install -q --timeout 60 streamlink==7.1.3 || "$venv/bin/python" -m pip install -q --timeout 60 streamlink
          "$venv/bin/python" -c "import yt_dlp" 2>/dev/null || "$venv/bin/python" -m pip install -q --timeout 60 yt-dlp==2025.10.22 || "$venv/bin/python" -m pip install -q --timeout 60 yt-dlp
          "$venv/bin/streamlink" --version; "$venv/bin/yt-dlp" --version
          echo "OUT=${DXB_CACHE:-/var/cache/dxb-render}/event-capture/$(date -u +%Y-%m-%d)-$SHOW" >> "$GITHUB_ENV"

      - name: Capture
        run: bash ops/backoffice/event-capture/capture.sh

      - name: Summary
        if: always()
        run: |
          { echo "## Event capture: $SHOW"; echo '```'; tail -n 40 "$OUT/capture.log" 2>/dev/null; echo '```'; df -h "$OUT" | tail -1; } >> "$GITHUB_STEP_SUMMARY"
