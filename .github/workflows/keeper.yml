# The promise keeper (adv-20261030-promise-keeper, addendum_2251; Mohammad 30 Oct 2026). Every 5 minutes it reads
# newsroom/commitments.json from main, places each open promise on the ladder from its slot (T-90, T-45, T-30, T-15,
# T+5), sends one ntfy alarm per row and rung, and force-pushes its status (one line, six lines, rows, state, log) to
# the branch `keeper-status` of this repository, one commit, so the branch never grows. Every scheduled session reads
# `git show origin/keeper-status:keeper/status.txt` first.
#
# It runs on GitHub's runners, not on dxb-render-1: the server cannot run user timers until root enables lingering for
# the runner user, and its only push token is scoped to dxb-watch. No load on the render server, no Claude.
# Alarm-only (KEEPER_MODE) until a release switches fallback on after the seven shadow tests pass.
# Posts nothing, schedules nothing, deletes nothing, renders nothing, touches no other branch. A push to
# `keeper-status` fires no workflow (gitleaks scans main only). The ntfy topic comes from the secret NTFY_TOPIC; without
# it the alarms stay in the status branch for the sessions to act on.
#
#   gh workflow run keeper.yml --ref main      # one pass now
#
# Build 10 Nov 2026 (adv-20261109-coordination-in-code): GitHub's */5 schedule ran this only every 4 to 8 hours on 8 and 9
# Nov, so dxb-render-1's keeper timer is the clock: every 10 minutes (and at :25 to :29) server_tick.sh sends a
# repository_dispatch `keeper-server` carrying its Publer read (times, networks, states, labels; no ids, no links).
# Each pass then also runs workorder.py: the hourly work order (keeper/work-order.json and .md, from :25 Dubai) and the
# hop alarms (keeper/hop.json, status.json `hop`, one ntfy push per alarm). The Production 1 inbox mirror copies the
# work order into dxb-queue desk/; Production 2 reads it from here or there and executes it top to bottom.
name: keeper

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [keeper-server]

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  tick:
    if: github.repository == 'mohdeltayer/dxb-assets' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEEPER_MODE: alarm-only
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ops/backoffice/keeper
            newsroom/commitments.json
            newsroom/helper-runs.jsonl
            newsroom/evergreen.md
            ops/build/releases
            ops/desk_audit.py
            templates/formats.py
            templates/assets/format-ledger.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Last state from keeper-status
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub/keeper"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
               fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" keeper-status 2>/dev/null; then
            for f in state.json keeper.log work-order.json work-order.md hop.json server-in.json; do
              git show "FETCH_HEAD:keeper/$f" > "$RUNNER_TEMP/pub/keeper/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/pub/keeper/$f"
            done
            echo "previous state read"
          else
            echo "no keeper-status branch yet: first pass, cold start"
          fi

      # The server's Publer read (repository_dispatch from dxb-render-1). On a scheduled or manual pass the last one
      # kept on keeper-status is used while it is fresh (keeper.py: 20 minutes).
      - name: Server read (from the dispatch)
        if: github.event_name == 'repository_dispatch'
        env:
          SERVER_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$SERVER_PAYLOAD" > "$RUNNER_TEMP/pub/keeper/server-in.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('server pass', d.get('generated_at'), 'code', d.get('code'), '|', d.get('publer'))" "$RUNNER_TEMP/pub/keeper/server-in.json"

      # The board is in dxb-queue, which this repository's token cannot read: with the read-only secret
      # QUEUE_READ_TOKEN (dxb-queue, Contents read) the started-line alarm runs; without it the status says
      # "board not read" and that alarm stays off. Release notes and the watch log come from this checkout.
      - name: Board (optional, read-only)
        env:
          QTOKEN: ${{ secrets.QUEUE_READ_TOKEN }}
        run: |
          if [ -n "$QTOKEN" ]; then
            curl -fsS -m 20 -H "Authorization: Bearer $QTOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/mohdeltayer/dxb-queue/contents/desk/board.json?ref=desk" \
              -o "$RUNNER_TEMP/board.json" && echo "BOARD_ARG=--board $RUNNER_TEMP/board.json" >> "$GITHUB_ENV" \
              || echo "board not read"
            # the work order also reads the inbox mirror's age and Mohammad's orders (desk/orders/*.json, may be absent)
            curl -fsS -m 20 -H "Authorization: Bearer $QTOKEN" -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/mohdeltayer/dxb-queue/contents/desk/mirror.json?ref=desk" \
              -o "$RUNNER_TEMP/mirror.json" && echo "MIRROR_ARG=--mirror $RUNNER_TEMP/mirror.json" >> "$GITHUB_ENV" \
              || echo "mirror not read"
            mkdir -p "$RUNNER_TEMP/orders"
            if curl -fsS -m 20 -H "Authorization: Bearer $QTOKEN" -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/mohdeltayer/dxb-queue/contents/desk/orders?ref=desk" -o "$RUNNER_TEMP/orders.json" 2>/dev/null; then
              python3 - "$RUNNER_TEMP/orders.json" > "$RUNNER_TEMP/orders.txt" <<'PYEOF'
          import json, sys
          for e in json.load(open(sys.argv[1])):
              if e.get('type') == 'file' and e.get('name', '').endswith('.json'):
                  print(e['name'])
          PYEOF
              while read -r n; do
                case "$n" in *[!A-Za-z0-9._-]*) continue;; esac
                curl -fsS -m 20 -H "Authorization: Bearer $QTOKEN" -H "Accept: application/vnd.github.raw" \
                  "https://api.github.com/repos/mohdeltayer/dxb-queue/contents/desk/orders/$n?ref=desk" -o "$RUNNER_TEMP/orders/$n" || true
              done < "$RUNNER_TEMP/orders.txt"
              echo "orders read: $(ls "$RUNNER_TEMP/orders" | wc -l)"
            else
              echo "no desk/orders yet"
            fi
          else
            echo "no QUEUE_READ_TOKEN: started-line check off"
          fi

      # The watch's branch head, so the coverage alarm names the seq the branch held (adv-20261108-stories-tab
      # addendum_0545). Public branch: a plain read.
      - name: Watch digest head (optional)
        run: |
          if git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" +watch-digest:refs/remotes/origin/watch-digest 2>/dev/null &&
             git show refs/remotes/origin/watch-digest:watch/digest.json > "$RUNNER_TEMP/digest.json" 2>/dev/null; then
            echo "DIGEST_ARG=--digest $RUNNER_TEMP/digest.json" >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/digests"
            for n in $(git ls-tree --name-only refs/remotes/origin/watch-digest:watch/digests 2>/dev/null); do
              case "$n" in *[!0-9.json]*) continue;; esac
              git show "refs/remotes/origin/watch-digest:watch/digests/$n" > "$RUNNER_TEMP/digests/$n" 2>/dev/null || true
            done
          else
            echo "watch-digest not read"
          fi

      - name: Tick
        env:
          KEEPER_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          SERVER_ARG=""
          [ -s "$RUNNER_TEMP/pub/keeper/server-in.json" ] && SERVER_ARG="--server $RUNNER_TEMP/pub/keeper/server-in.json"
          python3 ops/backoffice/keeper/keeper.py tick --commitments newsroom/commitments.json \
            --out "$RUNNER_TEMP/pub/keeper" --releases ops/build/releases --runs newsroom/helper-runs.jsonl \
            ${BOARD_ARG:-} ${DIGEST_ARG:-} $SERVER_ARG | tee -a "$GITHUB_STEP_SUMMARY"
          # The work order (hourly, from :25 Dubai) and the hop alarms (every pass); never stops the push below.
          if [ -n "${BOARD_ARG:-}" ]; then
            python3 ops/backoffice/keeper/workorder.py ${BOARD_ARG} ${MIRROR_ARG:-} ${DIGEST_ARG:-} \
              --orders "$RUNNER_TEMP/orders" --digests "$RUNNER_TEMP/digests" \
              --server "$RUNNER_TEMP/pub/keeper/server-in.json" --commitments newsroom/commitments.json \
              --ledger templates/assets/format-ledger.json --out "$RUNNER_TEMP/pub/keeper" \
              --state "$RUNNER_TEMP/pub/keeper/state.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "workorder: board not read, no work order this pass" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "commit $(git rev-parse --short HEAD)" >> "$RUNNER_TEMP/pub/keeper/keeper.log"
          exit 0   # an unreadable commitments file is in the status and the log; the push below still happens

      - name: Push keeper-status (one commit, forced)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/pub"
          git init -q
          git checkout -q --orphan keeper-status
          git add -A
          gen=$(python3 -c "import json; print(json.load(open('keeper/status.json'))['generated_at'])")
          git -c user.name=dxb-keeper -c user.email=noreply@github.com -c commit.gpgsign=false \
            commit -q -m "keeper $gen"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/keeper-status
          echo "pushed keeper-status: $gen" | tee -a "$GITHUB_STEP_SUMMARY"
