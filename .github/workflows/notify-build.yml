name: Build check-in

# Phone push when the build desk starts and when a release note lands (adv-20261103-three-focus-areas,
# checkins_1805). The topic comes from the NTFY_TOPIC secret and is never printed; messages carry no post text.
#   - push to main touching ops/build/releases/*.md: "Build released HH:MM Dubai: <items>; skipped: <items>"
#     (or "Build skipped ...") for each release note added or changed by the push
#   - workflow_dispatch kind=started, items="<planned>": "Build started HH:MM Dubai: <items>"
#   - workflow_dispatch kind=test: one test push
# The keeper's alarms (01:20 no started line, 04:15 no release note) stay as the fallback.

on:
  push:
    branches: [main]
    paths: ['ops/build/releases/*.md']
  workflow_dispatch:
    inputs:
      kind:
        description: 'started or test'
        required: true
        default: 'started'
      items:
        description: 'Items planned tonight (kind=started)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: notify-build
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'mohdeltayer/dxb-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            ops/build
          persist-credentials: false

      - name: Send
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KIND: ${{ github.event.inputs.kind }}
          ITEMS: ${{ github.event.inputs.items }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$KIND" in
              started) python3 ops/build/notify_build.py started "$ITEMS" ;;
              test)    python3 ops/build/notify_build.py test ;;
              *)       echo "kind must be started or test"; exit 1 ;;
            esac
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'ops/build/releases/*.md' 2>/dev/null || true)
          [ -n "$files" ] || files=$(ls -1 ops/build/releases/*.md | sort | tail -1)
          for f in $files; do python3 ops/build/notify_build.py release "$f"; done
