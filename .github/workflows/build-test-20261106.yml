# Build-night test for build/2026-11-06-audit-checks only (BUILD.md section 5). Runs on a push to that branch, on
# dxb-render-1, from the branch's own files. No secrets, read-only token, commits nothing, posts nothing.
# Deleted from the branch before the merge: it never reaches main.
name: build-test-20261106

permissions:
  contents: read

on:
  push:
    branches: ['build/2026-11-06-audit-checks']

jobs:
  test:
    if: github.repository == 'mohdeltayer/dxb-assets' && github.ref == 'refs/heads/build/2026-11-06-audit-checks'
    runs-on: [self-hosted, dxb-render]
    timeout-minutes: 15
    concurrency:
      group: build-test-20261106
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            templates
            jobs
            newsroom
            ops
          clean: true

      - name: Python
        run: |
          echo "${DXB_VENV:-/home/runner/venv}/bin" >> "$GITHUB_PATH"
          echo "runner $RUNNER_NAME, $(nproc) cores, $(df -h "$HOME" | tail -1 | awk '{print $4}') free"

      - name: Unit tests (build gate, keeper)
        run: |
          python -m unittest templates/test_buildgate.py -v 2>&1 | tail -12
          (cd ops/backoffice/keeper && python -m unittest discover -s . 2>&1 | tail -3)

      - name: ledger find no longer crashes; --record writes the story file
        run: |
          python newsroom/ledger.py find zelda > /tmp/find.txt 2> /tmp/find.err; echo "exit $?"
          tail -3 /tmp/find.txt; sort -u /tmp/find.err | head -3
          printf '%s' '{"id":"zz-build-test","title":"t","sources":[{"role":"primary","url":"https://example.com/a"}],"first_report":"example, 5 Nov 18:00Z","source_type":"primary","footage":"official trailer (test)","lane":"digital-lounge","beat":"trailer"}' > newsroom/stories/zz-build-test.json
          python newsroom/ledger.py find zelda --record zz-build-test | tail -1
          python -c "import json; print('ledger_find hits:', len(json.load(open('newsroom/stories/zz-build-test.json'))['ledger_find']['hits']))"

      - name: Gate refuses an ungated job; passes a complete one (render_job check)
        run: |
          mkdir -p jobs/live
          cp ops/exemplars/suda51-travis-touchdown-will-return-famitsu.json jobs/live/zz-old.json
          if python templates/render_job.py text jobs/live/zz-old.json > /tmp/old.txt 2>&1; then echo "FAIL: old job was not refused"; exit 1; fi
          head -5 /tmp/old.txt
          python - <<'PY'
          import json
          j = json.load(open('ops/exemplars/suda51-travis-touchdown-will-return-famitsu.json'))
          j.update({'story': 'zz-build-test', 'render_lane': 'server',
                    'reel_check': [{'line': f'line {i}', 'answer': 'yes', 'evidence': 'test'} for i in range(10)]})
          json.dump(j, open('jobs/live/zz-new.json', 'w'))
          j['render_lane'] = 'server'; json.dump(j, open('jobs/render/zz-wrong-folder.json', 'w'))
          PY
          python templates/buildgate.py jobs/live/zz-new.json
          if python templates/buildgate.py jobs/render/zz-wrong-folder.json; then echo "FAIL: server lane in jobs/render passed"; exit 1; fi
          python templates/render_job.py check jobs/live/zz-new.json > /tmp/new.txt 2>&1 || true
          head -3 /tmp/new.txt
          grep -q 'build gate: ok' /tmp/new.txt || { echo "FAIL: gate did not pass the complete job"; exit 1; }
          rm -f jobs/live/zz-*.json jobs/render/zz-*.json newsroom/stories/zz-build-test.json

      - name: Pre-submit (temp story, real file on main)
        run: |
          git fetch -q --depth 1 --filter=blob:none origin main
          python - <<'PY'
          import json, pathlib, sys, tempfile
          sys.path.insert(0, 'templates'); import presubmit as P
          t = pathlib.Path(tempfile.mkdtemp()); P.STORIES = t; P.LOG = t / 's.jsonl'; P.PUBLISHED = t / 'p.jsonl'
          (t / 's1.json').write_text(json.dumps({'id': 's1'}))
          out = 'cards/2026-11/ocarina-of-time-review-scores-nov-4-reel-v2.mp4'
          def refused(f, *a):
              try:
                  f(*a); return False
              except SystemExit as e:
                  print('refused:', str(e)[:100]); return True
          assert refused(P.intent, 'c1', 'instagram', 's1', out)
          P.director('s1', 'PASS', out)
          P.intent('c1', 'instagram', 's1', out)
          assert refused(P.intent, 'c1', 'instagram', 's1', out)
          P.result('c1', 'instagram', 'failed'); P.intent('c1', 'instagram', 's1', out)
          P.published('c1', 's1', ['a', 'b', 'c'], str(t / 'q'))
          print('presubmit ok')
          PY

      - name: Keeper bank line on the real files
        run: python ops/backoffice/keeper/keeper.py show --commitments newsroom/commitments.json | grep -E '^ *bank:'
